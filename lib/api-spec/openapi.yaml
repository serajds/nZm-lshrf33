          type: ["number", "null"]
        plannedProgress:
          type: ["number", "null"]
          description: Weighted planned progress for the project at today's date.
        actualProgress:
          type: number
          description: Weighted actual progress (overall project progress).
        status:
          type: string
          enum: [on_track, slightly_delayed, significantly_delayed, ahead, unavailable]
        suspensionDays:
          type: integer
        grossDelayDays:
          type: ["number", "null"]
        netDelayDays:
          type: ["number", "null"]
          description: Unknown without causal evidence; suspensions are not mechanically deducted.
        overrunDays:
          type: ["integer", "null"]
          description: Days passed after expectedEndDate while progress < 100%
        spi:
          type: ["number", "null"]
          description: Schedule Performance Index = actual / planned (>1 ahead, <1 behind).
        forecastCompletionDate:
          type: ["string", "null"]
          format: date
          description: Forecast completion date if the current pace continues.
        expectedProgressAtEnd:
          type: ["number", "null"]
          description: Conditional expected progress at the current scheduled end; unavailable after that date.
        contractEndDate:
          type: ["string", "null"]
          format: date
          deprecated: true
          description: Compatibility alias for currentEndDate, not proof of original contractual date.
        forecastDelayDays:
          type: ["integer", "null"]
          description: Days between forecastCompletionDate and contractEndDate (positive = late).
        suspensionsBreakdown:
          type: array
          description: Breakdown of suspension days by cause type.
          items:
            type: object
            properties:
              type:
                type: string
                enum: [official_holiday, force_majeure, contractor_delay]
              days:
                type: integer
              count:
                type: integer
            required:
              - type
              - days
              - count
        recommendations:
          type: array
          description: Auto-generated recommendations based on the project state.
          items:
            type: object
            properties:
              severity:
                type: string
                enum: [info, warning, critical]
              title:
                type: string
              description:
                type: string
            required:
              - severity
              - title
              - description
        activitiesAnalysis:
          type: array
          items:
            $ref: "#/components/schemas/ActivityDeviation"
        noSchedule:
          type: boolean
      required:
        - projectId
        - asOfDate
        - scheduleStatus
        - dataStatus
        - roundingTolerance
        - actualProgress
        - plannedProgress
        - forecastStatus
        - currentEndDate
        - shiftedSuspensionDays
        - unshiftedSuspensionDays
        - contractorSuspensionDays
        - timeDeviation
        - progressDeviation
        - status
        - activitiesAnalysis

    ActivityDeviation:
      type: object
      properties:
        groupId:
          type: ["integer", "null"]
        groupName:
          type: ["string", "null"]
        effectiveWeight:
          type: number
          description: Percentage of target project weight.
        sourceKind:
          type: string
          enum: [local, linked]
        sourceStatus:
          type: string
          enum: [local, live, stale, restricted]
        sourceKey:
          type: string
          description: Safe filter identifier, not a source access capability.
        sourceLabel:
          type: ["string", "null"]
        sourceDetails:
          type: array
          items:
            $ref: "#/components/schemas/DeviationSourceDetail"
        status:
          type: string
          enum: [on_track, slightly_delayed, significantly_delayed, ahead, unavailable]
        activityId:
          type: integer
        activityName:
          type: string
        plannedProgress:
          type: ["number", "null"]
        actualProgress:
          type: number
        deviation:
          type: ["number", "null"]
        weight:
          type: number
          description: Activity weight used in the project-level weighted average.
        weightedImpact:
          type: ["number", "null"]
          description: Contribution of this activity's deviation to overall project deviation (= deviation × weight / totalWeight).
        delayDays:
          type: ["integer", "null"]
          description: Deprecated alias for overrunDays (kept for backward compatibility)
        overrunDays:
          type: ["integer", "null"]
          description: Days past activity plannedEndDate while not completed
      required:
        - activityId
        - activityName
        - plannedProgress
        - actualProgress
        - deviation
        - effectiveWeight
        - sourceKind
        - sourceStatus
        - sourceKey
        - sourceLabel
        - sourceDetails
        - status
        - groupId
        - groupName

