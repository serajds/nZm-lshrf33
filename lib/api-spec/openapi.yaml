            type: ["string", "null"]
            format: date
        - name: dateTo
          in: query
          schema:
            type: ["string", "null"]
            format: date
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Attendance records
          content:
            application/json:
              schema:
                type: array
