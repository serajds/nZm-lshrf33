          in: path
          required: true
          schema:
            type: integer
        - name: dateFrom
          in: query
          schema:
            type: ["string", "null"]
            format: date
        - name: dateTo
          in: query
          schema:
            type: ["string", "null"]
            format: date
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeAttendanceReport"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    ImportActivitiesResponse:
      type: object
      properties:
        imported:
          type: integer
        errors:
          type: array
          items:
            type: string
        activities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
      required:
        - imported
        - activities

    # Auth
    LoginBody:
      type: object
      properties:
        phone:
          type: string
        password:
          type: string
      required:
        - phone
        - password

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required:
        - user
        - token

    RegisterResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required:
        - user

    RegisterBody:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        password:
          type: string
      required:
        - fullName
        - phone
        - password

    # User
    UserCompany:
      type: object
      properties:
        companyId:
          type: integer
        companyName:
          type: string
      required:
        - companyId
        - companyName

    UserProjectMembership:
      type: object
      properties:
        projectId:
          type: integer
        projectName:
          type: string
        role:
          type: string
          enum: [project_manager, engineer, contractor, viewer]
      required:
        - projectId
        - projectName
        - role

    User:
      type: object
      properties:
        id:
          type: integer
        phone:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [admin, project_manager, engineer, owner, contractor]
        companies:
          type: array
          items:
            $ref: "#/components/schemas/UserCompany"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/UserProjectMembership"
        incompleteProfile:
          type: boolean
        projectMembershipsCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - phone
        - fullName
        - role
        - createdAt

    CreateUserBody:
      type: object
      properties:
        phone:
          type: string
        password:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [admin, project_manager, engineer, owner, contractor]
        companyIds:
          type: array
          items:
            type: integer
        projectIds:
          type: array
          items:
            type: integer
      required:
        - phone
        - password
        - fullName
        - role

    ProjectMember:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        userId:
          type: integer
        role:
          type: string
          enum: [project_manager, engineer, contractor, viewer]
        createdAt:
          type: string
          format: date-time
        fullName:
          type: string
        phone:
          type: string
        userRole:
          type: string
        companyNames:
          type: array
          items:
            type: string
        assignedGroupIds:
          type: array
          items:
            type: integer
      required:
        - id
        - projectId
        - userId
        - role
        - createdAt
        - fullName
        - phone
        - userRole

    AddProjectMemberBody:
      type: object
      properties:
        userId:
          type: integer
        role:
          type: string
          enum: [project_manager, engineer, contractor, viewer]
        assignedGroupIds:
          type: array
          items:
            type: integer
      required:
        - userId
        - role

    UpdateProjectMemberBody:
      type: object
      properties:
        role:
          type: string
          enum: [project_manager, engineer, contractor, viewer]
        assignedGroupIds:
          type: array
          items:
            type: integer

    ProjectPermissions:
      type: object
      properties:
        role:
          type: string
        projectRole:
          type: string
        assignedGroupIds:
          type: array
          items:
            type: integer
        canEditAll:
          type: boolean
        isViewer:
          type: boolean
        tabPermissions:
          $ref: "#/components/schemas/TabPermissionsMap"
      required:
        - role
        - canEditAll

    TabAccess:
      type: string
      enum: [hidden, view, edit]

    TabPermissionsMap:
      type: object
      properties:
        overview:
          $ref: "#/components/schemas/TabAccess"
        activities:
          $ref: "#/components/schemas/TabAccess"
        extensions:
          $ref: "#/components/schemas/TabAccess"
        suspensions:
          $ref: "#/components/schemas/TabAccess"
        reports:
          $ref: "#/components/schemas/TabAccess"
        forms:
          $ref: "#/components/schemas/TabAccess"
        attendance:
          $ref: "#/components/schemas/TabAccess"
        files:
          $ref: "#/components/schemas/TabAccess"
        deviation:
          $ref: "#/components/schemas/TabAccess"

    MemberTabPermissions:
      type: object
      properties:
        memberId:
          type: integer
        projectId:
          type: integer
        userId:
          type: integer
        role:
          type: string
        overrides:
          oneOf:
            - $ref: "#/components/schemas/TabPermissionsMap"
            - type: "null"
        effective:
          $ref: "#/components/schemas/TabPermissionsMap"
      required:
        - memberId
        - projectId
        - userId
        - role
        - effective

    UpdateUserBody:
      type: object
      properties:
        fullName:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        role:
          type: ["string", "null"]
        password:
          type: ["string", "null"]
        companyIds:
          type: array
          items:
            type: integer
