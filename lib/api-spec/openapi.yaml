openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Engineering Supervision System
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: projects
    description: Project management
  - name: activities
    description: Schedule activities
  - name: reports
    description: Periodic reports
  - name: files
    description: File management
  - name: users
    description: User management
  - name: owner-portal
    description: Owner read-only portal
  - name: project-members
    description: Project member management
  - name: dashboard
    description: Dashboard analytics
  - name: attendance
    description: Staff attendance check-in/check-out

paths:
  /project-categories:
    get:
      operationId: listProjectCategories
      tags: [projects]
      summary: Categories visible in permitted projects; administrators see the catalog
      responses:
        "200":
          description: Visible project categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectCategory"
    post:
      operationId: createProjectCategory
      tags: [projects]
      summary: Create category as administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCategoryBody"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCategory"
  /project-categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateProjectCategory
      tags: [projects]
      summary: Rename category as administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCategoryBody"
      responses:
        "200":
          description: Renamed category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCategory"
    delete:
      operationId: deleteProjectCategory
      tags: [projects]
      summary: Remove category without deleting its projects
      responses:
        "204":
          description: Removed category
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with phone and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account not yet activated by admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Self-register a new user (name, phone, password). The new account starts inactive — no token is issued; the admin must link the user to a company and project before they can log in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Account created (inactive — awaiting admin activation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "409":
          description: Phone already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current logged-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Projects
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      parameters:
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectBody"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Activities (Schedule items)
  /projects/{projectId}/activity-groups:
    get:
      operationId: listActivityGroups
      tags: [activities]
      summary: List activity groups
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Activity groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityGroup"
    post:
      operationId: createActivityGroup
      tags: [activities]
      summary: Create an activity group
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivityGroupBody"
      responses:
        "201":
          description: Created activity group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityGroup"

  /projects/{projectId}/activity-groups/{id}:
    put:
      operationId: updateActivityGroup
      tags: [activities]
      summary: Update an activity group, including its normalized sharing code
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActivityGroupBody"
      responses:
        "200":
          description: Updated activity group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityGroup"

  /projects/{projectId}/activity-groups/search:
    get:
      operationId: searchActivityGroupSources
      tags: [activities]
      summary: Search shareable groups from projects accessible to the caller
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shareable matching source groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExternalSourceGroup"

  /projects/{projectId}/activities:
    get:
      operationId: listActivities
      tags: [activities]
      summary: List activities for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
    post:
      operationId: createActivity
      tags: [activities]
      summary: Create an activity
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivityBody"
      responses:
        "201":
          description: Created activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"

  /projects/{projectId}/activities/import:
    post:
      operationId: importActivities
      tags: [activities]
      summary: Import activities from Excel file
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportActivitiesResponse"
        "400":
          description: Validation errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string

  /projects/{projectId}/activities/{id}:
    patch:
      operationId: updateActivity
      tags: [activities]
      summary: Update an activity
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActivityBody"
      responses:
        "200":
          description: Updated activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
    delete:
      operationId: deleteActivity
      tags: [activities]
      summary: Delete an activity
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Reports
  /projects/{projectId}/reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List reports for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: ["string", "null"]
        - name: dateFrom
          in: query
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: createReport
      tags: [reports]
      summary: Create a report
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportBody"
      responses:
        "201":
          description: Created report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /projects/{projectId}/reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get a report by ID
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateReport
      tags: [reports]
      summary: Update a report
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportBody"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
    delete:
      operationId: deleteReport
      tags: [reports]
      summary: Delete a report
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/reports/{reportId}/image-groups/{groupIndex}/share:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
      - name: reportId
        in: path
        required: true
        schema:
          type: integer
      - name: groupIndex
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: createReportImageGroupShare
      tags: [reports]
      summary: Create a limited-time upload link for one saved report image group
      responses:
        "201":
          description: Created upload link
          content:
            application/json:
              schema:
                type: object
                properties:
                  shareId:
                    type: integer
                  publicToken:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  category:
                    type: string
                required: [shareId, publicToken, expiresAt, category]
        "404":
          description: Report or image group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: cancelReportImageGroupShare
      tags: [reports]
      summary: Cancel active upload links for one report image group
      responses:
        "204":
          description: Upload links cancelled

  /public/report-image-shares:
    get:
      operationId: getPublicReportImageShare
      tags: [reports]
      summary: Validate a public upload link and return limited section and report-period information
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Limited section information
          content:
            application/json:
              schema:
                type: object
                properties:
                  category:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  status:
                    type: string
                    enum: [pending, uploading]
                  periodStart:
                    type: string
                    format: date
                  periodEnd:
                    type: string
                    format: date
                required: [category, expiresAt, status, periodStart, periodEnd]
        "410":
          description: Link expired, cancelled, or completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /public/report-image-shares/upload:
    post:
      operationId: uploadPublicReportImage
      tags: [reports]
      summary: Add one validated image to the section named by its limited upload token
      parameters:
        - in: query
          name: token
          required: false
          schema:
            type: string
          description: Preferred token location; legacy clients may still send it in the request body.
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              description: JSON envelope with clientKey, fileName, mimeType, and base64. Legacy imageBase64 and body token are accepted.
      responses:
        "201":
          description: Image stored and attached to the shared section
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploaded:
                    type: boolean
                  uploadedCount:
                    type: integer
                  maxImages:
                    type: integer
        "200":
          description: Idempotent retry of an already stored image
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploaded:
                    type: boolean
                  uploadedCount:
                    type: integer
                  maxImages:
                    type: integer
        "400":
          description: Invalid or unsupported image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Link expired, cancelled, or completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Encoded request or image exceeds the five mebibyte limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Shared image admission is busy
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /public/report-image-shares/complete:
    post:
      operationId: completePublicReportImageShare
      tags: [reports]
      summary: Finish uploads and disable the public link
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              description: JSON-encoded object containing the upload token.
      responses:
        "200":
          description: Upload link completed
        "410":
          description: Link expired, cancelled, or already completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/reports/{id}/status:
    patch:
      operationId: updateReportStatus
      tags: [reports]
      summary: Approve or revert a report (project_manager / admin)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportStatusBody"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/reports/{id}/audit-log:
    get:
      operationId: getReportAuditLog
      tags: [reports]
      summary: Get the activity log for a single report
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Activity log entries (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportAuditLogEntry"

  /projects/{projectId}/reports/export-pdf:
    get:
      operationId: exportReportsPdf
      tags: [reports]
      summary: Export project reports as PDF
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Files
  /projects/{projectId}/reports/uploads:
    post:
      operationId: uploadReportImage
      tags: [reports]
      summary: Upload a report image using the shared image lifecycle
      description: The same JSON envelope is accepted as application/json or text/plain. Existing multipart clients remain supported by the server, but new clients should use this envelope.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreparedReportImagePacket"
          text/plain:
            schema:
              $ref: "#/components/schemas/PreparedReportImagePacket"
      responses:
        "201":
          description: Durable image and required derivatives confirmed; idempotent retries reuse the file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportImageUploadResult"
        "409":
          description: The idempotency key was previously used for different content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Image exceeds the central size or pixel policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Invalid image content or envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Capacity busy; Retry-After applies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Durable storage or required processing could not be confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/reports/uploads/status:
    get:
      operationId: getReportImageUploadStatus
      tags: [reports]
      summary: Recover upload state after losing its response without resending image bytes
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: clientKey
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Persistent state of this user's upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportImageUploadStatus"
        "404":
          description: Upload not found for this user and project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: The uploaded file reference was removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/files:
    get:
      operationId: listFiles
      tags: [files]
      summary: List a page of project files with project-wide summaries
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          description: One-based page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Number of files per page (maximum 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
        - name: category
          in: query
          schema:
            type: string
            enum: [image, pdf, test_result, document, other]
        - name: search
          in: query
          description: Case-insensitive substring search in the original filename
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Requested page, matching result count, and project-wide summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedProjectFiles"
        "400":
          description: Invalid pagination or filter parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: uploadFile
      tags: [files]
      summary: Upload a file for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
