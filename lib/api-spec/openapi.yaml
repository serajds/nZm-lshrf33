    UpdateReportBody:
      type: object
      properties:
        type:
          type: ["string", "null"]
          enum: [weekly, monthly, period, null]
        reportDate:
          type: ["string", "null"]
          format: date
        periodStart:
          type: ["string", "null"]
          format: date
        periodEnd:
          type: ["string", "null"]
          format: date
        workDescription:
          type: ["string", "null"]
        progressPercentage:
          type: ["number", "null"]
        progressSource:
          type: ["string", "null"]
          enum: [history, manual, null]
