    <style>
      html, body { margin: 0; padding: 0; background: #F6F7F5; }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        background: #F6F7F5;
        color: #17354B;
        font-family: 'Noto Kufi Arabic', sans-serif;
        transition: opacity 0.3s ease, visibility 0.3s ease;
        padding: 24px;
        text-align: center;
      }
      #app-splash.splash-hide {
        opacity: 0;
        visibility: hidden;
      }
      #app-splash .splash-logo {
        width: 164px;
        height: 60px;
        border-radius: 12px;
        background: #17354B;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 20px rgba(23, 53, 75, 0.14);
        animation: splash-pop 0.8s cubic-bezier(.2,.9,.3,1.2);
      }
      #app-splash .splash-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #app-splash .splash-title {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin: 0;
        color: #17354B;
        opacity: 0;
        animation: splash-fade 0.6s ease 0.2s forwards;
      }
      #app-splash .splash-sub {
        font-size: 14px;
        font-weight: 500;
        opacity: 0;
        color: #657783;
        margin: 0;
        animation: splash-fade 0.6s ease 0.4s forwards;
      }
      #app-splash .splash-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(23, 53, 75, 0.16);
        border-top-color: #D4A35A;
        border-radius: 50%;
        animation: splash-spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        margin-top: 4px;
      }
      @keyframes splash-pop {
        0% { transform: scale(0.6); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes splash-fade {
        to { opacity: 1; }
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="app-splash" role="status" aria-live="polite" aria-label="جاري تحميل التطبيق">
      <div class="splash-logo">
        <img src="/rikaz-logo.svg" alt="" />
      </div>
      <h1 class="splash-title">ركاز - RIKAZ</h1>
      <p class="splash-sub">جاري تهيئة ركاز…</p>
      <div class="splash-spinner" aria-hidden="true"></div>
      <button id="splash-retry" type="button" hidden onclick="window.location.reload()"
        style="border:0;border-radius:8px;padding:12px 24px;background:#17354B;color:#fff;font:inherit;cursor:pointer">
        إعادة المحاولة
      </button>
    </div>

    <script>
      // A failed entry module must leave a recoverable screen, not a blank
      // root. Only AuthProvider dismisses this screen once it can render
      // either the application or an explicit auth-connection error.
      window.__splashSafetyTimer = setTimeout(function () {
        var sub = document.querySelector('#app-splash .splash-sub');
        if (sub) sub.textContent = 'استغرق التحميل وقتاً أطول من المتوقع. تحقق من الاتصال أو أعد المحاولة.';
        var retry = document.getElementById('splash-retry');
        if (retry) retry.hidden = false;
      }, 12000);
      window.__splashSlowTimer = setTimeout(function () {
        var sub = document.querySelector('#app-splash .splash-sub');
        if (sub) sub.textContent = 'لا يزال التحميل جارياً — قد يستغرق وقتاً أطول على الشبكات البطيئة.';
      }, 6000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
