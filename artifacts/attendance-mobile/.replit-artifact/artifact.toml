kind = "mobile"
previewPath = "/attendance-mobile/"
title = "إدارة الإشراف والمتابعة - الجوال"
description = "تطبيق جوال عربي لموظفي الإشراف لتسجيل الدخول واختيار المشروع وتسجيل الحضور والانصراف بالصور والموقع."
version = "1.0.0"
id = "artifacts/attendance-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/attendance-mobile/" ]
localPort = 25272

[services.development]
run = "pnpm --filter @workspace/attendance-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/attendance-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/attendance-mobile", "run", "serve" ]

[services.env]
PORT = "25272"
BASE_PATH = "/attendance-mobile/"
